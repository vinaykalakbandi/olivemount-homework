name: Daily Homework Sync

on:
  schedule:
    # 3 checkpoints between 5:00 PM and 6:00 PM IST (Mon-Fri) on off-peak minutes
    # 11:40 UTC = 5:10 PM IST (early check as kids sit down to study)
    - cron: '40 11 * * 1-5'
    # 12:05 UTC = 5:35 PM IST (mid checkpoint for late teacher posts)
    - cron: '5 12 * * 1-5'
    # 12:25 UTC = 5:55 PM IST (final evening checkpoint before 6:00 PM)
    - cron: '25 12 * * 1-5'
  workflow_dispatch: # Allows manual run button anytime

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-homework:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Fetch Homework from MyClassBoard
        env:
          MCB_USER_1: ${{ secrets.MCB_USER_1 }}
          MCB_PASS_1: ${{ secrets.MCB_PASS_1 }}
          MCB_USER_2: ${{ secrets.MCB_USER_2 }}
          MCB_PASS_2: ${{ secrets.MCB_PASS_2 }}
        run: |
          python src/fetch_homework.py

      - name: Commit and Push Updated Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): update homework for $(date '+%Y-%m-%d')" && git push)
